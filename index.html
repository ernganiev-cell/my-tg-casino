<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Casino Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Простой темный дизайн в стиле казино */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .casino-card {
            background: #2c2c2c;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 80%;
            border: 2px solid #ffd700;
        }

        h1 { color: #ffd700; margin-bottom: 10px; font-size: 24px; }
        
        .balance-box {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
            color: #4cd137;
        }

        .btn-spin {
            background: linear-gradient(180deg, #ffd700, #b8860b);
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-spin:active {
            transform: scale(0.95);
        }

        #status {
            margin-top: 15px;
            height: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="casino-card">
        <h1 id="welcome-msg">Удачи, Игрок!</h1>
        <div class="balance-box">💰 <span id="balance">1000</span></div>
        
        <button class="btn-spin" onclick="playGame()">КРУТИТЬ!</button>
        
        <div id="status">Нажми кнопку, чтобы начать</div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Пытаемся достать имя пользователя из Telegram
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('welcome-msg').innerText = `Удачи, ${user.first_name}!`;
        }

        let currentBalance = 1000;

        function playGame() {
            const status = document.getElementById('status');
            const balanceDisplay = document.getElementById('balance');

            // Простая логика: шанс 40% на победу
            const isWin = Math.random() < 0.4;
            
            // Вибрация телефона (Haptic Feedback)
            tg.HapticFeedback.impactOccurred('medium');

            if (isWin) {
                currentBalance += 100;
                status.innerText = "🎉 ВЫИГРЫШ +100!";
                status.style.color = "#4cd137";
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                currentBalance -= 50;
                status.innerText = "❌ Проигрыш -50. Еще раз?";
                status.style.color = "#e84118";
            }

            balanceDisplay.innerText = currentBalance;

            // Если баланс кончился
            if (currentBalance <= 0) {
                alert("Баланс пуст! Мы начислили вам еще 500 для теста.");
                currentBalance = 500;
                balanceDisplay.innerText = currentBalance;
            }
        }
    </script>
</body>
</html>
